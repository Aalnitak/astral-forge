{% extends "base.html" %}

{% block title %}Asignar mision{% endblock %}

{% block content %}
  <section class="min-h-[calc(100vh-5rem)] bg-base-200">
    <div class="mx-auto max-w-2xl px-6 py-8">
      <div class="mb-6">
        <a class="btn btn-ghost btn-sm" href="{% url 'guardian:dashboard' %}">
          Volver
        </a>
      </div>

      <div class="card bg-base-100 shadow-sm">
        <div class="card-body">
          <h1 class="card-title text-2xl">Asignar mision</h1>
          <p class="text-base-content/70">
            Elige una mision activa y el forjador que la recibira.
          </p>

          {% if form.non_field_errors %}
            <div class="alert alert-error mt-4">
              <span>{{ form.non_field_errors|join:" " }}</span>
            </div>
          {% endif %}

          <form class="mt-4 space-y-5" method="post">
            {% csrf_token %}

            <label class="form-control w-full">
              <span class="label-text">{{ form.forger.label }}</span>
              <select class="select select-bordered mt-2 w-full" name="{{ form.forger.html_name }}" required>
                <option value="">Selecciona un forjador</option>
                {% for option in form.forger.field.queryset %}
                  <option value="{{ option.pk }}" {% if form.forger.value|stringformat:"s" == option.pk|stringformat:"s" %}selected{% endif %}>
                    {{ option.display_name }}
                  </option>
                {% endfor %}
              </select>
              {% if form.forger.errors %}
                <span class="mt-2 text-sm text-error">{{ form.forger.errors|join:" " }}</span>
              {% endif %}
            </label>

            <label class="form-control w-full">
              <span class="label-text">{{ form.mission.label }}</span>
              <select class="select select-bordered mt-2 w-full" name="{{ form.mission.html_name }}" required>
                <option value="">Selecciona una mision</option>
                {% for option in form.mission.field.queryset %}
                  <option value="{{ option.pk }}" {% if form.mission.value|stringformat:"s" == option.pk|stringformat:"s" %}selected{% endif %}>
                    {{ option.title }} · {{ option.get_cadence_display }}
                  </option>
                {% endfor %}
              </select>
              {% if form.mission.errors %}
                <span class="mt-2 text-sm text-error">{{ form.mission.errors|join:" " }}</span>
              {% endif %}
            </label>

            <div class="grid gap-4 md:grid-cols-2">
              <label class="form-control w-full">
                <span class="label-text">{{ form.starts_on.label }}</span>
                <input
                  class="input input-bordered mt-2 w-full"
                  type="date"
                  name="{{ form.starts_on.html_name }}"
                  value="{{ form.starts_on.value|default:'' }}"
                >
                {% if form.starts_on.errors %}
                  <span class="mt-2 text-sm text-error">{{ form.starts_on.errors|join:" " }}</span>
                {% endif %}
              </label>

              <label class="form-control w-full">
                <span class="label-text">{{ form.ends_on.label }}</span>
                <input
                  class="input input-bordered mt-2 w-full"
                  type="date"
                  name="{{ form.ends_on.html_name }}"
                  value="{{ form.ends_on.value|default:'' }}"
                >
                {% if form.ends_on.errors %}
                  <span class="mt-2 text-sm text-error">{{ form.ends_on.errors|join:" " }}</span>
                {% endif %}
              </label>
            </div>

            <div class="card-actions justify-end">
              <a class="btn btn-ghost" href="{% url 'guardian:dashboard' %}">
                Cancelar
              </a>
              <button class="btn btn-primary" type="submit">
                Asignar mision
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
