<div id="reward-card-{{ card.reward.id }}" class="rounded-box border border-base-300 p-4">
  <div class="flex h-full flex-col justify-between gap-4">
    <div>
      <div class="flex items-start justify-between gap-3">
        <h3 class="font-semibold">{{ card.reward.title }}</h3>
        <span class="badge badge-secondary">
          {{ card.reward.star_cost }} estrellas
        </span>
      </div>
      {% if card.reward.description %}
        <p class="mt-2 text-sm text-base-content/70">
          {{ card.reward.description }}
        </p>
      {% endif %}
    </div>

    {% if card.can_request %}
      <form
        method="post"
        action="{% url 'forgers:request_reward' card.reward.id %}"
        hx-post="{% url 'forgers:request_reward' card.reward.id %}"
        hx-target="#reward-card-{{ card.reward.id }}"
        hx-swap="outerHTML"
      >
        {% csrf_token %}
        <button class="btn btn-sm btn-secondary w-full" type="submit">
          Solicitar
        </button>
      </form>
    {% else %}
      <button class="btn btn-sm w-full" type="button" disabled>
        Faltan {{ card.missing_stars }} estrellas
      </button>
    {% endif %}
  </div>
</div>
